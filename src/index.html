<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimpleBar</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <!--
      The wheel. Live as of M3: the Rust side watches usage.json and pushes
      each new reading in, so this reflects the current number rather than a
      snapshot taken when the window opened.
    -->
    <div id="wheel-container">
      <svg id="wheel" viewBox="0 0 200 200">
        <!-- Backdrop: a solid disc behind the centre text, independent of
             the transparent window — without it the text sits directly on
             the desktop showing through. Gap to the track's inner edge
             (64) matches the ticks-to-track gap (5 units), so the layering
             reads consistently. -->
        <circle class="backdrop" cx="100" cy="100" r="59" />
        <!-- Ticks: a static ring of dashes, the graduations of the gauge. -->
        <circle class="ticks" cx="100" cy="100" r="92" />
        <!-- Track: the drained portion, always visible underneath. -->
        <circle class="track" cx="100" cy="100" r="72" />
        <!-- Progress: the remaining portion. Drains clockwise from 12
             o'clock as stroke-dashoffset grows — see main.js. -->
        <circle id="progress" cx="100" cy="100" r="72" />
      </svg>
      <div id="center-text">
        <div id="reading">Loading…</div>
        <div id="model"></div>
      </div>
    </div>
  </body>
</html>
