<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimpleBar</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <!--
      The wheel. Live as of M3: the Rust side watches usage.json and pushes
      each new reading in, so this reflects the current number rather than a
      snapshot taken when the window opened.
    -->
    <div id="wheel-container">
      <svg id="wheel" viewBox="0 0 200 200">
        <!-- Backdrop: a solid disc behind the centre text, independent of
             the transparent window — without it the text sits directly on
             the desktop showing through. Gap to the track's inner edge
             (64) matches the ticks-to-track gap (5 units), so the layering
             reads consistently. -->
        <circle class="backdrop" cx="100" cy="100" r="59" />
        <!-- Ticks: a static ring of dashes, the graduations of the gauge. -->
        <circle class="ticks" cx="100" cy="100" r="92" />
        <!-- Track: the drained portion, always visible underneath. -->
        <circle class="track" cx="100" cy="100" r="72" />
        <!-- Progress: the remaining portion. Drains clockwise from 12
             o'clock as stroke-dashoffset grows — see main.js. -->
        <circle id="progress" cx="100" cy="100" r="72" />
      </svg>
      <div id="center-text">
        <div id="reading">Loading…</div>
        <div id="model"></div>
        <!--
          A real <button>, not a styled div: it is the only control on the
          face of the HUD, and this is what gets it keyboard focus, Enter and
          Space, and an announced role for free. aria-pressed carries the
          state, so the glyph is decoration to a screen reader rather than
          something it has to interpret.
        -->
        <!-- The two controls sit side by side, mute then pin, separated by a
             gap about a button wide so neither is misclicked for the other. -->
        <div id="controls">
          <button id="mute" type="button" aria-pressed="false">
            <span id="mute-glyph" aria-hidden="true">🔊</span>
          </button>
          <!--
            Pin on top. Same button contract as mute. The glyph is an inline
            SVG (not an emoji) so the stylesheet can colour it — green when
            pinned, red when not — and the slash line is shown only in the
            unpinned state, so the toggle reads without relying on colour alone.
          -->
          <button id="pin" type="button" aria-pressed="false">
            <svg id="pin-glyph" viewBox="0 0 24 24" aria-hidden="true">
              <!-- A pushpin, filled with the button's current colour. -->
              <path
                d="M9 2h6l-1 6 3 3v2h-4v6l-1 2-1-2v-6H6v-2l3-3z"
                fill="currentColor"
              />
              <!-- Slash across the pin — visible only when unpinned. -->
              <line
                class="pin-slash"
                x1="4" y1="20" x2="20" y2="4"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
