name: checks

# Three jobs, deliberately kept apart.
#
# `producer` needs nothing beyond Python and Rust's own toolchain — it is the
# statusLine binary in isolation, and it either passes or something is
# genuinely wrong.
#
# `app` builds the Tauri side, which means system webview and GTK
# dependencies on Linux runners. That is the less predictable half, so it is
# isolated — if a platform dependency ever breaks, the failure is visibly its
# own and `producer` still reports honestly.
#
# `windows` is the only place the Windows build is ever compiled. A Mac can
# cross-check the producer crate for `x86_64-pc-windows-msvc`, but not the app:
# its build script ends in `tauri-winres`, which needs a Windows resource
# compiler that macOS does not ship. So this job is not a nicety — without it,
# Windows breakage is invisible until someone boots Windows. It uploads the
# installer as an artifact for exactly that reason: the way to test on the PC is
# to download what CI built, not to build there.

on:
  # Every push, on every branch — the secret scan is a hard rule and must not
  # wait for a pull request to exist.
  push:
  pull_request:
  workflow_dispatch:

jobs:
  producer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # `make test` runs both suites — cargo for the producer, node for the
      # consumer — so both toolchains have to be here before it, not after.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: No credentials in the repository
        run: make check

      # Not `make test`: that includes the app's Rust tests, which need the
      # system webview and GTK. This job is deliberately dependency-free.
      - name: Tests — producer and consumer
        run: make test-producer

      - name: Fixtures are what they claim to be
        run: |
          # malformed.json is deliberately broken — it must stay broken, or the
          # test it feeds stops testing anything. Every other fixture must parse.
          for f in tests/fixtures/*.json; do
            if [ "$(basename "$f")" = "malformed.json" ]; then
              python -c "import json,sys; json.load(open(sys.argv[1]))" "$f" 2>/dev/null \
                && { echo "  FAIL $f is valid JSON but should be malformed"; exit 1; }
              echo "  ok  $f (malformed, as intended)"
            else
              python -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
              echo "  ok  $f"
            fi
          done

      - name: Rust producer builds
        run: cargo build --manifest-path statusline/Cargo.toml

      # The prototype this used to be compared against was retired once the
      # Rust tests covered everything its tests did. What is still worth
      # asserting is the property that mattered in the status line: whatever
      # the fixture, the producer exits 0 and never writes to stderr. A status
      # line that errors is worse than one that prints nothing.
      - name: Producer stays quiet on every fixture
        run: |
          BIN=statusline/target/debug/simplebar-statusline
          # Redirected so the run cannot write into a real state directory.
          export XDG_STATE_HOME="$(mktemp -d)"
          for f in tests/fixtures/*.json; do
            err=$("$BIN" < "$f" 2>&1 >/dev/null)
            code=$?
            [ "$code" = "0" ] || { echo "  FAIL $f: exit $code"; exit 1; }
            [ -z "$err" ] || { echo "  FAIL $f: wrote to stderr: $err"; exit 1; }
            echo "  ok  $f"
          done

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Before the app, not beside it: tauri.conf.json lists the producer as a
      # bundled resource, so tauri-build refuses to compile the app while the
      # binary is absent. Release, because that is the path the bundle names.
      - name: Producer builds, for the app to bundle
        run: make producer

      - name: Tauri app builds
        run: cargo build --manifest-path src-tauri/Cargo.toml

      # Runs here rather than in `producer` because the dependencies are
      # already present in this job — it is the half that builds the app.
      - name: App tests
        run: make test-app

  windows:
    runs-on: windows-latest

    # Every step in bash, not PowerShell. The Makefile is the single entry
    # point on both platforms, and it needs a Unix shell — Git Bash ships with
    # the runner, so this costs nothing and avoids a second set of recipes.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Windows has no `make` of its own and the runner image does not carry
      # one. Installing it here keeps CI running the same commands a developer
      # runs, rather than a hand-copied list that can drift from the Makefile.
      - name: Set up make
        run: choco install make --no-progress -y

      - name: Install dependencies
        run: npm ci

      # The same suites the Linux job runs, on Windows: this is where the path
      # resolution meets a real `%LOCALAPPDATA%` and a real backslash separator
      # instead of the simulated `Platform::Windows` the unit tests use.
      - name: Tests — producer and consumer
        run: make test-producer

      # The whole point of the job. `make build` compiles the producer, then the
      # app, then bundles the NSIS installer — the first two are what catch a
      # broken `#[cfg]` branch, and the third is what gets downloaded and
      # tested on a real machine.
      - name: App and installer build
        run: make build

      - name: App tests
        run: make test-app

      # Unsigned by decision, so SmartScreen will warn on first launch — see
      # "The build is unsigned on both platforms" in DESIGN.md. Retained for the
      # default 90 days, which is longer than any test session needs.
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: SimpleBar-windows-x64-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
