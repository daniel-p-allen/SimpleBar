name: checks

# Two jobs, deliberately kept apart.
#
# `producer` needs nothing beyond Python and Rust's own toolchain — it is the
# statusLine binary in isolation, and it either passes or something is
# genuinely wrong.
#
# `app` builds the Tauri side, which means system webview and GTK
# dependencies on Linux runners. That is the less predictable half, so it is
# isolated — if a platform dependency ever breaks, the failure is visibly its
# own and `producer` still reports honestly.

on:
  # Every push, on every branch — the secret scan is a hard rule and must not
  # wait for a pull request to exist.
  push:
  pull_request:
  workflow_dispatch:

jobs:
  producer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # `make test` runs both suites — cargo for the producer, node for the
      # consumer — so both toolchains have to be here before it, not after.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: No credentials in the repository
        run: make check

      # Not `make test`: that includes the app's Rust tests, which need the
      # system webview and GTK. This job is deliberately dependency-free.
      - name: Tests — producer and consumer
        run: make test-producer

      - name: Fixtures are what they claim to be
        run: |
          # malformed.json is deliberately broken — it must stay broken, or the
          # test it feeds stops testing anything. Every other fixture must parse.
          for f in tests/fixtures/*.json; do
            if [ "$(basename "$f")" = "malformed.json" ]; then
              python -c "import json,sys; json.load(open(sys.argv[1]))" "$f" 2>/dev/null \
                && { echo "  FAIL $f is valid JSON but should be malformed"; exit 1; }
              echo "  ok  $f (malformed, as intended)"
            else
              python -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
              echo "  ok  $f"
            fi
          done

      - name: Rust producer builds
        run: cargo build --manifest-path statusline/Cargo.toml

      # The prototype this used to be compared against was retired once the
      # Rust tests covered everything its tests did. What is still worth
      # asserting is the property that mattered in the status line: whatever
      # the fixture, the producer exits 0 and never writes to stderr. A status
      # line that errors is worse than one that prints nothing.
      - name: Producer stays quiet on every fixture
        run: |
          BIN=statusline/target/debug/simplebar-statusline
          # Redirected so the run cannot write into a real state directory.
          export XDG_STATE_HOME="$(mktemp -d)"
          for f in tests/fixtures/*.json; do
            err=$("$BIN" < "$f" 2>&1 >/dev/null)
            code=$?
            [ "$code" = "0" ] || { echo "  FAIL $f: exit $code"; exit 1; }
            [ -z "$err" ] || { echo "  FAIL $f: wrote to stderr: $err"; exit 1; }
            echo "  ok  $f"
          done

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Tauri app builds
        run: cargo build --manifest-path src-tauri/Cargo.toml

      # Runs here rather than in `producer` because the dependencies are
      # already present in this job — it is the half that builds the app.
      - name: App tests
        run: make test-app
