[package]
name = "simplebar"
version = "0.1.0"
description = "SimpleBar — a HUD for the Claude 5-hour session limit"
authors = ["Daniel Allen"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
#
# Note on `macos-private-api`: it stays in the plain `[dependencies]` table and
# is never moved under `[target.'cfg(target_os = "macos")'.dependencies]`.
# `tauri-build` cross-checks this feature list against `macOSPrivateApi` in
# `tauri.conf.json` by reading the manifest, and it does not look inside
# target-scoped tables — gating it there fails the build on every platform. The
# feature costs nothing on Windows, where it compiles to no code.

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "simplebar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# File watching (M3). Uses the OS notification API (FSEvents on macOS) rather
# than polling, which is what keeps idle CPU at ~0% per DESIGN.md.
notify = "8"
# The producer crate, for its settings.json wiring — the Connect button and
# `make install-statusline` must edit Claude Code's config the same way, so
# both call this rather than keeping a copy each. Path dependency: the two
# crates ship together and are versioned together.
simplebar-statusline = { path = "../statusline" }

